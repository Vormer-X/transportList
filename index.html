<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход – СК-ТСМ</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: #f0f0f0;
            padding: 20px;
        }
        
        main { 
            width: 100%; 
            max-width: 400px; 
        }
        
        .header { 
            background: #ff6a00; 
            color: #fff; 
            text-align: center; 
            padding: 25px 20px; 
            border-radius: 10px 10px 0 0; 
            font-size: 1.5rem; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }
        
        .container { 
            background: #1f1f1f; 
            padding: 30px 20px; 
            border-radius: 0 0 10px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px;
        }
        
        .container input { 
            width: 100%; 
            padding: 15px; 
            background: #1f1f1f; 
            border: 1px solid #ff6a00; 
            border-radius: 5px; 
            color: #fff; 
            font-size: 1rem; 
            transition: all 0.3s;
        }
        
        .container input:focus {
            outline: none;
            border-color: #ff6a00;
            box-shadow: 0 0 0 2px rgba(255, 106, 0, 0.3);
            background: #2a2a2a;
        }
        
        .container input::placeholder { 
            color: #aaa; 
        }
        
        .container button { 
            width: 100%; 
            padding: 15px; 
            background: #ff6a00; 
            color: #fff; 
            border: none; 
            border-radius: 5px; 
            font-size: 1.1rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .container button:hover { 
            background: #e05e00; 
            transform: translateY(-2px);
        }
        
        .container button:active {
            transform: translateY(0);
        }
        
        .container button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        #message { 
            color: #ff6a00; 
            margin-top: 5px; 
            font-size: 0.9rem;
            text-align: center;
            min-height: 20px;
        }
        
        /* Стили для мобильных устройств */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 20px 15px;
                font-size: 1.3rem;
                border-radius: 8px 8px 0 0;
            }
            
            .container {
                padding: 25px 15px;
                border-radius: 0 0 8px 8px;
                gap: 12px;
            }
            
            .container input {
                padding: 14px;
                font-size: 0.95rem;
                border-radius: 4px;
            }
            
            .container button {
                padding: 14px;
                font-size: 1rem;
                border-radius: 4px;
            }
        }
        
        /* Стили для очень маленьких экранов */
        @media (max-width: 320px) {
            .header {
                font-size: 1.1rem;
                padding: 15px 10px;
            }
            
            .container {
                padding: 20px 10px;
                gap: 10px;
            }
            
            .container input {
                padding: 12px;
                font-size: 0.9rem;
            }
            
            .container button {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="header">ВХОД В СЕРВИС СК-ТСМ</div>
        <div class="container">
            <input id="email" type="email" placeholder="Электронная почта" autocomplete="email">
            <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
            <button id="loginBtn">ВОЙТИ</button>
            <div id="message"></div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>

    <script>
        // Конфигурация Firebase
        var firebaseConfig = {
            apiKey: "AIzaSyApQ3Uf09PPE777KAoFP_J0RIP73XzXPcc",
            authDomain: "sktsm-20bda.firebaseapp.com",
            databaseURL: "https://sktsm-20bda-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sktsm-20bda",
            storageBucket: "sktsm-20bda.firebasestorage.app",
            messagingSenderId: "777878757517",
            appId: "1:777878757517:web:cdffc314809f92b2d802c4",
            measurementId: "G-FWSX7MENHT"
        };
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();

        var emailInput = document.getElementById('email');
        var passInput = document.getElementById('password');
        var message = document.getElementById('message');
        var loginBtn = document.getElementById('loginBtn');

        // Проверка авторизации
        auth.onAuthStateChanged(function(user) {
            if (user) {
                window.location.href = 'startMenu.html';
            }
        });

        // Обработка входа
        loginBtn.addEventListener('click', function() {
            var email = emailInput.value.trim();
            var password = passInput.value.trim();
            
            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'ВХОД...';
            
            auth.signInWithEmailAndPassword(email, password)
                .then(function() {
                    // Успешный вход - редирект произойдёт автоматически
                })
                .catch(function(error) {
                    console.error(error);
                    showMessage(getErrorMessage(error), 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'ВОЙТИ';
                });
        });

        // Вход по Enter
        passInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        // Функция отображения сообщений
        function showMessage(text, type) {
            message.textContent = text;
            message.style.color = type === 'error' ? '#ff6a00' : '#28a745';
        }

        // Получение понятного сообщения об ошибке
        function getErrorMessage(error) {
            switch(error.code) {
                case 'auth/invalid-email':
                    return 'Неверный формат email';
                case 'auth/user-disabled':
                    return 'Аккаунт отключен';
                case 'auth/user-not-found':
                    return 'Пользователь не найден';
                case 'auth/wrong-password':
                    return 'Неверный пароль';
                case 'auth/too-many-requests':
                    return 'Слишком много попыток. Попробуйте позже';
                default:
                    return 'Ошибка входа. Попробуйте снова';
            }
        }
    </script>
</body>
</html>
