<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёт о деятельности строительной техники ООО СК-ТСМ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .content {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            padding: 30px 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .content h3 {
            color: #222;
            font-size: 1.6rem;
            font-weight: 600;
            border-bottom: 3px solid #ff6a00;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .placeholder {
            width: 100%;
            background: #fafafa;
            border-radius: 12px;
            padding: 20px 25px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border: 1px solid #e0e0e0;
        }

        .record-item {
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #000;
            font-weight: 500;
            font-size: 1rem;
            transition: 0.2s;
        }

        .record-item:hover {
            background: #f5f5f5;
            border-color: #bbb;
        }

        .record-info {
            flex: 1;
            text-align: left;
        }

        .record-info .comment {
            color: #555;
            font-weight: 400;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .record-actions {
            display: flex;
            gap: 10px;
        }

        .record-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.15s;
        }

        .btn-edit {
            background: #ffa726;
            color: #fff;
        }

        .btn-edit:hover {
            background: #fb8c00;
        }

        .btn-delete {
            background: #ef5350;
            color: #fff;
        }

        .btn-delete:hover {
            background: #c62828;
        }

        .btn-back {
            background: #78909c;
            color: #fff;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            align-self: flex-start;
        }

        .btn-back:hover {
            background: #546e7a;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 5px;
        }

        .functions {
            background: #ff6a00;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(255, 106, 0, 0.3);
            min-width: 160px;
        }

        .functions:hover {
            background: #e05e00;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(255, 106, 0, 0.35);
        }

        .functions.excel {
            background: #1e7e34;
            box-shadow: 0 2px 8px rgba(30, 126, 52, 0.3);
        }

        .functions.excel:hover {
            background: #166b2b;
        }

        .functions.danger {
            background: #d32f2f;
        }

        .functions.danger:hover {
            background: #b71c1c;
        }

        .elementBtn {
            width: 100%;
            max-width: 400px;
            padding: 14px 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #222;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .elementBtn:hover {
            background: #ff6a00;
            color: white;
            border-color: #ff6a00;
        }

        /* ========== МОДАЛЬНЫЕ ОКНА ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(2px);
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px 35px;
            min-width: 340px;
            max-width: 90%;
            width: 500px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-box h3 {
            color: #222;
            text-align: center;
            font-weight: 600;
        }

        .modal-box input,
        .modal-box textarea {
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }

        .modal-box textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-box input:focus,
        .modal-box textarea:focus {
            outline: none;
            border-color: #ff6a00;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .modal-actions .btn-save {
            background: #ff6a00;
            color: white;
        }

        .modal-actions .btn-save:hover {
            background: #e05e00;
        }

        .modal-actions .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .modal-actions .btn-cancel:hover {
            background: #bdbdbd;
        }

        .modal-actions .btn-select-all {
            background: #1976d2;
            color: white;
        }

        .modal-actions .btn-select-all:hover {
            background: #0d47a1;
        }

        /* Список объектов в модалках */
        .export-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
            width: 100%;
        }

        .export-list label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.1s;
            cursor: pointer;
            width: 100%;
            min-height: 40px;
        }

        .export-list label:hover {
            background: #f0f0f0;
        }

        .export-list label span {
            flex: 1;
            text-align: left;
            padding-right: 10px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .export-list label input[type="checkbox"],
        .export-list label input[type="radio"] {
            flex-shrink: 0;
            transform: scale(1.3);
            cursor: pointer;
            margin-left: auto;
            accent-color: #ff6a00;
        }

        /* Стилизация скроллбара */
        .export-list::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar {
            width: 8px;
        }

        .export-list::-webkit-scrollbar-thumb,
        .modal-box::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .export-list::-webkit-scrollbar-thumb:hover,
        .modal-box::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .date-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .date-group input {
            flex: 1;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .logout-btn {
            background: #555;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        .logout-btn:hover {
            background: #333;
        }

        /* ========== АДАПТАЦИЯ ДЛЯ МОБИЛЬНЫХ ========== */
        @media (max-width: 600px) {
            .content {
                padding: 20px 15px;
            }

            .content h3 {
                font-size: 1.4rem;
            }

            .functions {
                min-width: 100%;
                padding: 12px 16px;
                font-size: 0.95rem;
            }

            .record-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .record-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .date-group {
                flex-wrap: wrap;
            }

            /* Улучшенные модалки на мобильных */
            .modal-box {
                padding: 20px;
                min-width: 0;
                width: 95%;
                border-radius: 12px;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }

            .modal-actions button {
                width: 100%;
                padding: 12px;
            }

            /* Список в модалке */
            .export-list {
                max-height: 50vh;
                padding: 10px;
            }

            .export-list label {
                padding: 12px 10px;
                gap: 15px;
            }

            .export-list label input[type="checkbox"],
            .export-list label input[type="radio"] {
                transform: scale(1.5);
                margin-left: 10px;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 15px 10px;
                border-radius: 12px;
            }

            .placeholder {
                padding: 15px;
            }

            .record-actions button {
                font-size: 0.8rem;
                padding: 8px 10px;
            }

            .btn-back {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div id="objectsPlace" class="content">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                <h3>Доступные объекты</h3>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
            <div id="placeholder" class="placeholder"></div>
            <div class="buttons">
                <button class="functions" id="firstBtn">Создать объект</button>
                <button class="functions danger" id="secondBtn">Удалить объект</button>
                <button class="functions excel" id="exportBtn">📊 Экспорт в Excel</button>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

    <script>
        // ================== Firebase инициализация ==================
        const firebaseConfig = {
            apiKey: "AIzaSyApQ3Uf09PPE777KAoFP_J0RIP73XzXPcc",
            authDomain: "sktsm-20bda.firebaseapp.com",
            databaseURL: "https://sktsm-20bda-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sktsm-20bda",
            storageBucket: "sktsm-20bda.firebasestorage.app",
            messagingSenderId: "777878757517",
            appId: "1:777878757517:web:cdffc314809f92b2d802c4",
            measurementId: "G-FWSX7MENHT"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = 'index.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'index.html');
        });

        // ================== Глобальные переменные ==================
        const placeholder = document.getElementById('placeholder');
        let currentObject = null;

        // ================== Вспомогательные функции ==================
        function showToast(msg) { alert(msg); }

        function closeModal(overlay) {
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }

        function normalizeEntry(entry) {
            if (typeof entry === 'number') return { hours: entry, comment: '' };
            if (entry && typeof entry === 'object') {
                return { hours: entry.hours || 0, comment: entry.comment || '' };
            }
            return { hours: 0, comment: '' };
        }

        function validateDate(day, month, year) {
            const d = parseInt(day, 10),
                m = parseInt(month, 10),
                y = parseInt(year, 10);
            if (isNaN(d) || isNaN(m) || isNaN(y)) return null;
            if (d < 1 || d > 31 || m < 1 || m > 12 || y < 2000) return null;
            return { day: String(d).padStart(2, '0'), month: String(m).padStart(2, '0'), year: String(y) };
        }

        function validateHours(value) {
            const num = Number(value);
            return !isNaN(num) && num > 0 && isFinite(num);
        }

        // ================== Управление кнопками ==================
        function updateButtons(mode) {
            const firstBtn = document.getElementById('firstBtn');
            const secondBtn = document.getElementById('secondBtn');
            const exportBtn = document.getElementById('exportBtn');

            if (mode === 'list') {
                firstBtn.textContent = 'Создать объект';
                firstBtn.onclick = () => showAddObjectModal();
                secondBtn.classList.remove('hidden');
                secondBtn.textContent = 'Удалить объект';
                secondBtn.onclick = () => deleteObject();
                exportBtn.style.display = 'inline-block';
            } else {
                firstBtn.textContent = '➕ Добавить запись';
                firstBtn.onclick = () => showAddRecordModal();
                secondBtn.classList.add('hidden');
                exportBtn.style.display = 'inline-block';
            }
        }

        // ================== Загрузка объектов ==================
        function getObjects() {
            placeholder.innerHTML = '';
            const objectsRef = db.ref('Objects');
            objectsRef.once('value').then(snapshot => {
                const data = snapshot.val();
                if (!data) {
                    placeholder.innerHTML = '<p style="color:#888; font-weight:400;">Нет созданных объектов</p>';
                } else {
                    for (const key in data) {
                        const btn = document.createElement('button');
                        btn.textContent = key;
                        btn.className = 'elementBtn';
                        btn.onclick = () => selectObject(key);
                        placeholder.appendChild(btn);
                    }
                }
                currentObject = null;
                updateButtons('list');
            }).catch(() => showToast('Ошибка загрузки объектов'));
        }

        // ================== Просмотр записей объекта с сортировкой ==================
        function selectObject(objectName) {
            currentObject = objectName;
            placeholder.innerHTML = '<button class="btn-back" onclick="getObjects()">← Назад</button>';

            const objRef = db.ref('Objects/' + objectName);
            objRef.once('value').then(snapshot => {
                const data = snapshot.val();
                if (!data) {
                    placeholder.innerHTML += '<p style="color:#888; font-weight:400; margin-top:20px;">Нет записей</p>';
                    updateButtons('details');
                    return;
                }

                const records = [];
                for (const year in data) {
                    for (const month in data[year]) {
                        for (const day in data[year][month]) {
                            const entry = data[year][month][day];
                            const { hours, comment } = normalizeEntry(entry);
                            const dateStr = `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
                            records.push({ year, month, day, hours, comment, dateStr });
                        }
                    }
                }

                // Сортировка от новых к старым
                records.sort((a, b) => b.dateStr.localeCompare(a.dateStr));

                let numeral = 1;
                for (const rec of records) {
                    const { year, month, day, hours, comment } = rec;
                    const recordDiv = document.createElement('div');
                    recordDiv.className = 'record-item';

                    const infoSpan = document.createElement('span');
                    infoSpan.className = 'record-info';
                    infoSpan.innerHTML = `${numeral}) ${day}.${month}.${year} — <strong>${hours} ч.</strong> <span class="comment">${comment ? '📝 ' + comment : ''}</span>`;
                    recordDiv.appendChild(infoSpan);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'record-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn-edit';
                    editBtn.textContent = '✎ Редактировать';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        showEditRecordModal(day, month, year, hours, comment);
                    };
                    actionsDiv.appendChild(editBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-delete';
                    delBtn.textContent = '✕ Удалить';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`Удалить запись за ${day}.${month}.${year}?`)) {
                            deleteRecord(day, month, year);
                        }
                    };
                    actionsDiv.appendChild(delBtn);

                    recordDiv.appendChild(actionsDiv);
                    placeholder.appendChild(recordDiv);
                    numeral++;
                }
                updateButtons('details');
            }).catch(() => showToast('Ошибка загрузки записей'));
        }

        // ================== Модальные окна ==================
        function createModal(title, bodyHTML, saveLabel) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const modal = document.createElement('div');
            modal.className = 'modal-box';

            const h3 = document.createElement('h3');
            h3.textContent = title;
            modal.appendChild(h3);

            const bodyDiv = document.createElement('div');
            bodyDiv.innerHTML = bodyHTML;
            modal.appendChild(bodyDiv);

            const actions = document.createElement('div');
            actions.className = 'modal-actions';
            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn-save';
            saveBtn.textContent = saveLabel;
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-cancel';
            cancelBtn.textContent = 'Отмена';
            actions.appendChild(saveBtn);
            actions.appendChild(cancelBtn);
            modal.appendChild(actions);

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            cancelBtn.onclick = () => closeModal(overlay);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal(overlay);
            });

            return overlay;
        }

        // --- Создание объекта ---
        function showAddObjectModal() {
            const overlay = createModal(
                'Создание нового объекта',
                `<input type="text" id="inputObjectName" placeholder="Название объекта (без пробелов и спецсимволов)" />`,
                'Создать'
            );
            const saveBtn = overlay.querySelector('.btn-save');
            const inputName = overlay.querySelector('#inputObjectName');

            saveBtn.onclick = () => {
                const name = inputName.value.trim();
                if (!name) return showToast('Введите название объекта');
                if (/[\s\/.#$\[\]]/.test(name)) {
                    return showToast('Имя не должно содержать пробелы, /, ., #, $, [, ]');
                }
                const objRef = db.ref('Objects/' + name);
                objRef.once('value').then(snap => {
                    if (snap.exists()) {
                        showToast('Объект с таким именем уже существует');
                        return Promise.reject('exists');
                    }
                    return objRef.set({});
                }).then(() => {
                    showToast('Объект создан');
                    closeModal(overlay);
                    getObjects();
                }).catch(err => {
                    if (err !== 'exists') showToast('Ошибка: ' + err.message);
                });
            };
        }

        // --- Добавление записи ---
        function showAddRecordModal() {
            const overlay = createModal(
                'Добавление записи',
                `
                    <div class="date-group">
                        <input type="number" id="inputDay" placeholder="День" min="1" max="31" />
                        <input type="number" id="inputMonth" placeholder="Месяц" min="1" max="12" />
                        <input type="number" id="inputYear" placeholder="Год" min="2000" />
                    </div>
                    <input type="number" id="inputTime" placeholder="Количество часов" />
                    <textarea id="inputComment" placeholder="Комментарий (необязательно)"></textarea>
                `,
                'Добавить'
            );
            const saveBtn = overlay.querySelector('.btn-save');
            const dayInp = overlay.querySelector('#inputDay');
            const monthInp = overlay.querySelector('#inputMonth');
            const yearInp = overlay.querySelector('#inputYear');
            const timeInp = overlay.querySelector('#inputTime');
            const commentInp = overlay.querySelector('#inputComment');

            saveBtn.onclick = () => {
                const day = dayInp.value.trim();
                const month = monthInp.value.trim();
                const year = yearInp.value.trim();
                const hoursStr = timeInp.value.trim();
                const comment = commentInp.value.trim();

                if (!day || !month || !year || !hoursStr) return showToast('Заполните все поля даты и часы');
                const parsed = validateDate(day, month, year);
                if (!parsed) return showToast('Неверная дата (день 1-31, месяц 1-12, год >=2000)');
                if (!validateHours(hoursStr)) return showToast('Часы должны быть положительным числом');

                const hours = Number(hoursStr);
                const { day: d, month: m, year: y } = parsed;
                const recordRef = db.ref(`Objects/${currentObject}/${y}/${m}/${d}`);

                recordRef.once('value').then(snap => {
                    const existing = snap.val();
                    let newHours = hours;
                    let newComment = comment;
                    if (existing !== null) {
                        const old = normalizeEntry(existing);
                        newHours = old.hours + hours;
                        if (!newComment && old.comment) newComment = old.comment;
                    }
                    return recordRef.set({ hours: newHours, comment: newComment });
                }).then(() => {
                    showToast('Запись добавлена');
                    closeModal(overlay);
                    selectObject(currentObject);
                }).catch(e => showToast('Ошибка добавления: ' + e.message));
            };
        }

        // --- Редактирование записи ---
        function showEditRecordModal(day, month, year, currentHours, currentComment) {
            const overlay = createModal(
                `Редактирование записи ${day}.${month}.${year}`,
                `
                    <input type="number" id="editTime" placeholder="Новое количество часов" value="${currentHours}" />
                    <textarea id="editComment" placeholder="Комментарий">${currentComment || ''}</textarea>
                `,
                'Сохранить'
            );
            const saveBtn = overlay.querySelector('.btn-save');
            const timeInp = overlay.querySelector('#editTime');
            const commentInp = overlay.querySelector('#editComment');

            saveBtn.onclick = () => {
                const hoursStr = timeInp.value.trim();
                if (!validateHours(hoursStr)) return showToast('Часы должны быть положительным числом');
                const hours = Number(hoursStr);
                const comment = commentInp.value.trim();
                const recordRef = db.ref(`Objects/${currentObject}/${year}/${month}/${day}`);
                recordRef.set({ hours, comment })
                    .then(() => {
                        showToast('Запись обновлена');
                        closeModal(overlay);
                        selectObject(currentObject);
                    })
                    .catch(() => showToast('Ошибка обновления'));
            };
        }

        // ================== Удаление записи ==================
        function deleteRecord(day, month, year) {
            const recordRef = db.ref(`Objects/${currentObject}/${year}/${month}/${day}`);
            recordRef.remove()
                .then(() => {
                    showToast('Запись удалена');
                    selectObject(currentObject);
                })
                .catch(() => showToast('Ошибка удаления записи'));
        }

        // ================== Удаление объекта ==================
        function deleteObject() {
            if (!currentObject) {
                // Показываем список объектов для выбора
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'modal-box';
                const title = document.createElement('h3');
                title.textContent = 'Выберите объект для удаления';
                modal.appendChild(title);

                const listDiv = document.createElement('div');
                listDiv.className = 'export-list';
                const objectsRef = db.ref('Objects');
                objectsRef.once('value').then(snap => {
                    const data = snap.val();
                    if (!data) {
                        showToast('Нет объектов для удаления');
                        closeModal(overlay);
                        return;
                    }
                    let selected = null;
                    for (const key in data) {
                        const label = document.createElement('label');
                        const span = document.createElement('span');
                        span.textContent = key;
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = 'deleteObject';
                        radio.value = key;
                        radio.onchange = () => { selected = key; };
                        label.appendChild(span);
                        label.appendChild(radio);
                        listDiv.appendChild(label);
                    }
                    modal.appendChild(listDiv);

                    const actions = document.createElement('div');
                    actions.className = 'modal-actions';
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-save';
                    delBtn.textContent = 'Удалить выбранный';
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'btn-cancel';
                    cancelBtn.textContent = 'Отмена';
                    actions.appendChild(delBtn);
                    actions.appendChild(cancelBtn);
                    modal.appendChild(actions);
                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);

                    cancelBtn.onclick = () => closeModal(overlay);
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) closeModal(overlay);
                    });

                    delBtn.onclick = () => {
                        if (!selected) return showToast('Выберите объект');
                        if (!confirm(`Удалить объект "${selected}" и все его записи?`)) return;
                        db.ref('Objects/' + selected).remove()
                            .then(() => {
                                showToast('Объект удалён');
                                closeModal(overlay);
                                getObjects();
                            })
                            .catch(() => showToast('Ошибка удаления объекта'));
                    };
                }).catch(() => showToast('Ошибка загрузки объектов'));
                return;
            }

            // Удаление текущего объекта
            if (confirm(`Удалить объект "${currentObject}" и все его записи?`)) {
                db.ref('Objects/' + currentObject).remove()
                    .then(() => {
                        showToast('Объект удалён');
                        currentObject = null;
                        getObjects();
                    })
                    .catch(() => showToast('Ошибка удаления объекта'));
            }
        }

        // ================== Экспорт в Excel ==================
        function exportExcel() {
            if (currentObject) {
                const objRef = db.ref('Objects/' + currentObject);
                objRef.once('value').then(snap => {
                    const data = snap.val();
                    if (!data) return showToast('Нет данных для экспорта');
                    const rows = [
                        ['Объект', 'Год', 'Месяц', 'День', 'Часы', 'Комментарий']
                    ];
                    for (const year in data) {
                        for (const month in data[year]) {
                            for (const day in data[year][month]) {
                                const { hours, comment } = normalizeEntry(data[year][month][day]);
                                rows.push([currentObject, year, month, day, hours, comment]);
                            }
                        }
                    }
                    downloadExcel(rows, currentObject + '_отчёт_' + new Date().toISOString().slice(0, 10) + '.xlsx');
                    showToast('Отчёт по объекту выгружен');
                }).catch(() => showToast('Ошибка экспорта'));
                return;
            }

            // Модалка выбора объектов
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const modal = document.createElement('div');
            modal.className = 'modal-box';
            const title = document.createElement('h3');
            title.textContent = 'Выберите объекты для экспорта';
            modal.appendChild(title);

            const listDiv = document.createElement('div');
            listDiv.className = 'export-list';
            const objectsRef = db.ref('Objects');
            objectsRef.once('value').then(snap => {
                const data = snap.val();
                if (!data) {
                    showToast('Нет объектов для экспорта');
                    return;
                }
                const checkboxes = {};
                for (const key in data) {
                    const label = document.createElement('label');
                    const span = document.createElement('span');
                    span.textContent = key;
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = key;
                    cb.checked = true;
                    checkboxes[key] = cb;
                    label.appendChild(span);
                    label.appendChild(cb);
                    listDiv.appendChild(label);
                }
                modal.appendChild(listDiv);

                const actions = document.createElement('div');
                actions.className = 'modal-actions';
                const selectAllBtn = document.createElement('button');
                selectAllBtn.className = 'btn-select-all';
                selectAllBtn.textContent = 'Выбрать все';
                const exportBtn = document.createElement('button');
                exportBtn.className = 'btn-save';
                exportBtn.textContent = 'Экспортировать выбранные';
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn-cancel';
                cancelBtn.textContent = 'Отмена';
                actions.appendChild(selectAllBtn);
                actions.appendChild(exportBtn);
                actions.appendChild(cancelBtn);
                modal.appendChild(actions);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                selectAllBtn.onclick = () => {
                    const all = Object.values(checkboxes);
                    const checked = all.every(cb => cb.checked);
                    all.forEach(cb => cb.checked = !checked);
                };
                cancelBtn.onclick = () => closeModal(overlay);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModal(overlay);
                });

                exportBtn.onclick = () => {
                    const selected = Object.keys(checkboxes).filter(k => checkboxes[k].checked);
                    if (selected.length === 0) return showToast('Выберите хотя бы один объект');
                    closeModal(overlay);

                    const allRows = [
                        ['Объект', 'Год', 'Месяц', 'День', 'Часы', 'Комментарий']
                    ];
                    const promises = selected.map(obj =>
                        db.ref('Objects/' + obj).once('value').then(snap => {
                            const d = snap.val();
                            if (d) {
                                for (const year in d) {
                                    for (const month in d[year]) {
                                        for (const day in d[year][month]) {
                                            const { hours, comment } = normalizeEntry(d[year][month][day]);
                                            allRows.push([obj, year, month, day, hours, comment]);
                                        }
                                    }
                                }
                            }
                        })
                    );
                    Promise.all(promises).then(() => {
                        if (allRows.length === 1) return showToast('Нет данных для выбранных объектов');
                        downloadExcel(allRows, 'Отчёт_по_объектам_' + new Date().toISOString().slice(0, 10) + '.xlsx');
                        showToast('Отчёт выгружен');
                    }).catch(() => showToast('Ошибка экспорта'));
                };
            }).catch(() => showToast('Ошибка загрузки объектов'));
        }

        function downloadExcel(rows, filename) {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, 'Отчёт');
            XLSX.writeFile(wb, filename);
        }

        document.getElementById('exportBtn').addEventListener('click', exportExcel);

        // ================== Старт ==================
        getObjects();
    </script>
</body>
</html>
