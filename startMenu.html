<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёт о деятельности строительной техники ООО СК-ТСМ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-sizing: border-box; }
        body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        main { width: 100%; max-width: 1100px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .content { background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); padding: 30px 40px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .content h3 { color: #222; font-size: 1.6rem; font-weight: 600; border-bottom: 3px solid #ff6a00; padding-bottom: 10px; width: 100%; text-align: center; }
        .placeholder { width: 100%; background: #fafafa; border-radius: 12px; padding: 20px 25px; min-height: 300px; max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; border: 1px solid #e0e0e0; }
        .record-item { width: 100%; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; color: #000; font-weight: 500; font-size: 1rem; transition: 0.2s; }
        .record-item:hover { background: #f5f5f5; border-color: #bbb; }
        .record-info { flex: 1; text-align: left; }
        .record-info .comment { color: #555; font-weight: 400; font-size: 0.9rem; margin-left: 10px; }
        .record-actions { display: flex; gap: 10px; }
        .record-actions button { padding: 6px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: 0.15s; }
        .btn-edit { background: #ffa726; color: #fff; }
        .btn-edit:hover { background: #fb8c00; }
        .btn-delete { background: #ef5350; color: #fff; }
        .btn-delete:hover { background: #c62828; }
        .btn-back { background: #78909c; color: #fff; padding: 8px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.9rem; align-self: flex-start; }
        .btn-back:hover { background: #546e7a; }
        .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; margin-top: 5px; }
        .functions { background: #ff6a00; color: white; border: none; border-radius: 30px; padding: 12px 28px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 8px rgba(255,106,0,0.3); min-width: 160px; }
        .functions:hover { background: #e05e00; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255,106,0,0.35); }
        .functions.excel { background: #1e7e34; box-shadow: 0 2px 8px rgba(30,126,52,0.3); }
        .functions.excel:hover { background: #166b2b; }
        .functions.danger { background: #d32f2f; }
        .functions.danger:hover { background: #b71c1c; }
        .elementBtn { width: 100%; max-width: 400px; padding: 14px 20px; background: white; border: 1px solid #ccc; border-radius: 8px; font-size: 1.1rem; font-weight: 600; color: #222; cursor: pointer; transition: 0.2s; text-align: center; }
        .elementBtn:hover { background: #ff6a00; color: white; border-color: #ff6a00; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(2px); }
        .modal-box { background: white; border-radius: 16px; padding: 30px 35px; min-width: 340px; max-width: 90%; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; }
        .modal-box h3 { color: #222; text-align: center; font-weight: 600; }
        .modal-box input, .modal-box textarea { padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; width: 100%; }
        .modal-box textarea { resize: vertical; min-height: 60px; }
        .modal-box input:focus, .modal-box textarea:focus { outline: none; border-color: #ff6a00; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 5px; flex-wrap: wrap; }
        .modal-actions button { padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .modal-actions .btn-save { background: #ff6a00; color: white; }
        .modal-actions .btn-save:hover { background: #e05e00; }
        .modal-actions .btn-cancel { background: #e0e0e0; color: #333; }
        .modal-actions .btn-cancel:hover { background: #bdbdbd; }
        .modal-actions .btn-select-all { background: #1976d2; color: white; }
        .modal-actions .btn-select-all:hover { background: #0d47a1; }
        .export-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 5px; }
        .export-list label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 1rem; padding: 6px 10px; border-radius: 6px; transition: 0.1s; cursor: pointer; }
        .export-list label:hover { background: #f0f0f0; }
        .export-list label span { flex: 1; }
        .export-list label input[type="checkbox"], .export-list label input[type="radio"] { margin-left: auto; transform: scale(1.3); cursor: pointer; }
        .date-group { display: flex; gap: 10px; width: 100%; }
        .date-group input { flex: 1; text-align: center; }
        .hidden { display: none !important; }
        .logout-btn { background: #555; color: white; border: none; border-radius: 30px; padding: 10px 25px; font-weight: 600; cursor: pointer; margin-left: auto; }
        .logout-btn:hover { background: #333; }
        @media (max-width: 600px) { .content { padding: 20px; } .functions { min-width: 120px; padding: 10px 16px; font-size: 0.9rem; } .record-item { flex-wrap: wrap; gap: 8px; } .record-actions { width: 100%; justify-content: flex-end; } .date-group { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <main>
        <div id="objectsPlace" class="content">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                <h3>Доступные объекты</h3>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
            <div id="placeholder" class="placeholder"></div>
            <div class="buttons">
                <button class="functions" id="firstBtn">Создать объект</button>
                <button class="functions danger" id="secondBtn">Удалить объект</button>
                <button class="functions excel" id="exportBtn">📊 Экспорт в Excel</button>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyApQ3Uf09PPE777KAoFP_J0RIP73XzXPcc",
            authDomain: "sktsm-20bda.firebaseapp.com",
            databaseURL: "https://sktsm-20bda-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sktsm-20bda",
            storageBucket: "sktsm-20bda.firebasestorage.app",
            messagingSenderId: "777878757517",
            appId: "1:777878757517:web:cdffc314809f92b2d802c4",
            measurementId: "G-FWSX7MENHT"
        };
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.database();

        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            auth.signOut().then(function() {
                window.location.href = 'index.html';
            });
        });

        var placeholder = document.getElementById('placeholder');
        var currentObject = null;

        function closeModal(overlay) { if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); }
        function showToast(msg) { alert(msg); }
        function validateHours(value) { var num = Number(value); return !(isNaN(num) || num <= 0 || !isFinite(num)); }
        function validateDate(day, month, year) {
            var d = parseInt(day,10), m = parseInt(month,10), y = parseInt(year,10);
            if (isNaN(d)||isNaN(m)||isNaN(y)) return null;
            if (d<1||d>31||m<1||m>12||y<2000) return null;
            return { day: String(d).padStart(2,'0'), month: String(m).padStart(2,'0'), year: String(y) };
        }

        function updateButtons(mode) {
            var firstBtn = document.getElementById('firstBtn');
            var secondBtn = document.getElementById('secondBtn');
            var exportBtn = document.getElementById('exportBtn');

            if (mode === 'list') {
                firstBtn.textContent = 'Создать объект';
                firstBtn.onclick = function() { addData(); };
                secondBtn.classList.remove('hidden');
                secondBtn.textContent = 'Удалить объект';
                secondBtn.onclick = function() { deleteObject(); };
                exportBtn.style.display = 'inline-block';
            } else if (mode === 'details') {
                firstBtn.textContent = '➕ Добавить запись';
                firstBtn.onclick = function() { addData(); };
                secondBtn.classList.add('hidden');
                exportBtn.style.display = 'inline-block';
            }
        }

        function getObjects() {
            placeholder.innerHTML = '';
            var objectsRef = db.ref('Objects');
            objectsRef.once('value').then(function(snapshot) {
                var data = snapshot.val();
                if (!data) {
                    placeholder.innerHTML = '<p style="color:#888; font-weight:400;">Нет созданных объектов</p>';
                } else {
                    for (var key in data) {
                        var btn = document.createElement('button');
                        btn.textContent = key;
                        btn.className = 'elementBtn';
                        btn.onclick = (function(k) { return function() { selectObject(k); }; })(key);
                        placeholder.appendChild(btn);
                    }
                }
                currentObject = null;
                updateButtons('list');
            }).catch(function(e) {
                console.error(e);
                showToast('Ошибка загрузки объектов');
            });
        }

        function selectObject(objectName) {
            currentObject = objectName;
            placeholder.innerHTML = '<button class="btn-back" onclick="getObjects()">← Назад</button>';
            var objRef = db.ref('Objects/' + objectName);
            objRef.once('value').then(function(snapshot) {
                var data = snapshot.val();
                if (!data) {
                    placeholder.innerHTML += '<p style="color:#888; font-weight:400; margin-top:20px;">Нет записей</p>';
                } else {
                    var numeral = 1;
                    for (var year in data) {
                        for (var month in data[year]) {
                            for (var day in data[year][month]) {
                                var entry = data[year][month][day];
                                var hours, comment = '';
                                if (typeof entry === 'number') {
                                    hours = entry;
                                } else if (entry && typeof entry === 'object') {
                                    hours = entry.hours || 0;
                                    comment = entry.comment || '';
                                } else {
                                    hours = 0;
                                }
                                var recordDiv = document.createElement('div');
                                recordDiv.className = 'record-item';
                                var infoSpan = document.createElement('span');
                                infoSpan.className = 'record-info';
                                infoSpan.innerHTML = numeral + ') ' + day + '.' + month + '.' + year + ' — <strong>' + hours + ' ч.</strong> <span class="comment">' + (comment ? '📝 '+comment : '') + '</span>';
                                recordDiv.appendChild(infoSpan);

                                var actionsDiv = document.createElement('div');
                                actionsDiv.className = 'record-actions';

                                var editBtn = document.createElement('button');
                                editBtn.className = 'btn-edit';
                                editBtn.textContent = '✎ Редактировать';
                                editBtn.onclick = (function(d, m, y, h, c) {
                                    return function(e) {
                                        e.stopPropagation();
                                        editRecord(d, m, y, h, c);
                                    };
                                })(day, month, year, hours, comment);
                                actionsDiv.appendChild(editBtn);

                                var delBtn = document.createElement('button');
                                delBtn.className = 'btn-delete';
                                delBtn.textContent = '✕ Удалить';
                                delBtn.onclick = (function(d, m, y) {
                                    return function(e) {
                                        e.stopPropagation();
                                        if (confirm('Удалить запись за ' + d + '.' + m + '.' + y + '?')) {
                                            deleteRecord(d, m, y);
                                        }
                                    };
                                })(day, month, year);
                                actionsDiv.appendChild(delBtn);

                                recordDiv.appendChild(actionsDiv);
                                placeholder.appendChild(recordDiv);
                                numeral++;
                            }
                        }
                    }
                }
                updateButtons('details');
            }).catch(function(e) {
                console.error(e);
                showToast('Ошибка загрузки записей');
            });
        }

        function addData() {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            var modal = document.createElement('div');
            modal.className = 'modal-box';
            var title = document.createElement('h3');
            var isObjectMode = (currentObject === null);
            title.textContent = isObjectMode ? 'Создание нового объекта' : 'Добавление записи';
            modal.appendChild(title);

            var inputName, inputDay, inputMonth, inputYear, inputTime, inputComment;

            if (isObjectMode) {
                inputName = document.createElement('input');
                inputName.type = 'text';
                inputName.placeholder = 'Введите название объекта (без пробелов и спецсимволов)';
                inputName.id = 'inputObjectName';
                modal.appendChild(inputName);
            } else {
                var dateGroup = document.createElement('div');
                dateGroup.className = 'date-group';
                inputDay = document.createElement('input');
                inputDay.type = 'number';
                inputDay.placeholder = 'День';
                inputDay.id = 'inputDay';
                inputDay.min = 1; inputDay.max = 31;
                dateGroup.appendChild(inputDay);

                inputMonth = document.createElement('input');
                inputMonth.type = 'number';
                inputMonth.placeholder = 'Месяц';
                inputMonth.id = 'inputMonth';
                inputMonth.min = 1; inputMonth.max = 12;
                dateGroup.appendChild(inputMonth);

                inputYear = document.createElement('input');
                inputYear.type = 'number';
                inputYear.placeholder = 'Год';
                inputYear.id = 'inputYear';
                inputYear.min = 2000;
                dateGroup.appendChild(inputYear);
                modal.appendChild(dateGroup);

                inputTime = document.createElement('input');
                inputTime.type = 'number';
                inputTime.placeholder = 'Количество часов';
                inputTime.id = 'inputTime';
                modal.appendChild(inputTime);

                inputComment = document.createElement('textarea');
                inputComment.placeholder = 'Комментарий (необязательно)';
                inputComment.id = 'inputComment';
                modal.appendChild(inputComment);
            }

            var actions = document.createElement('div');
            actions.className = 'modal-actions';
            var saveBtn = document.createElement('button');
            saveBtn.className = 'btn-save';
            saveBtn.textContent = 'Сохранить';
            var cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-cancel';
            cancelBtn.textContent = 'Отмена';
            actions.appendChild(saveBtn);
            actions.appendChild(cancelBtn);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            cancelBtn.onclick = function() { closeModal(overlay); };

            saveBtn.onclick = function() {
                if (isObjectMode) {
                    var name = inputName.value.trim();
                    if (!name) { showToast('Введите название объекта'); return; }
                    // Запрещаем пробелы, слеш и точки с #$[]
                    if (/[\s\/.#$\[\]]/.test(name)) {
                        showToast('Имя не должно содержать пробелы, /, ., #, $, [, ]');
                        return;
                    }
                    var objRef = db.ref('Objects/' + name);
                    console.log('Попытка создания объекта:', 'Objects/' + name);
                    objRef.once('value').then(function(snap) {
                        if (snap.exists()) { 
                            showToast('Объект с таким именем уже существует');
                            return;
                        }
                        return objRef.set({});
                    }).then(function() {
                        console.log('Объект успешно создан');
                        showToast('Объект создан');
                        closeModal(overlay);
                        getObjects();
                    }).catch(function(e) {
                        console.error('Ошибка создания объекта:', e);
                        showToast('Ошибка: ' + (e.message || 'неизвестная ошибка'));
                    });
                } else {
                    var day = inputDay.value.trim();
                    var month = inputMonth.value.trim();
                    var year = inputYear.value.trim();
                    var hoursStr = inputTime.value.trim();
                    var comment = inputComment ? inputComment.value.trim() : '';
                    if (!day || !month || !year || !hoursStr) { showToast('Заполните все поля даты и часы'); return; }
                    var parsed = validateDate(day, month, year);
                    if (!parsed) { showToast('Неверная дата (день 1-31, месяц 1-12, год >=2000)'); return; }
                    if (!validateHours(hoursStr)) { showToast('Часы должны быть положительным числом'); return; }
                    var hours = Number(hoursStr);
                    var d = parsed.day, m = parsed.month, y = parsed.year;

                    var recordRef = db.ref('Objects/' + currentObject + '/' + y + '/' + m + '/' + d);
                    recordRef.once('value').then(function(snap) {
                        var existing = snap.val();
                        var newHours = hours;
                        var newComment = comment;
                        if (existing !== null) {
                            var oldHours = 0;
                            if (typeof existing === 'number') {
                                oldHours = existing;
                            } else if (existing && typeof existing === 'object') {
                                oldHours = existing.hours || 0;
                                if (!newComment && existing.comment) newComment = existing.comment;
                            }
                            newHours = oldHours + hours;
                            if (!newComment && existing && existing.comment) newComment = existing.comment;
                        }
                        return recordRef.set({ hours: newHours, comment: newComment });
                    }).then(function() {
                        showToast('Запись добавлена');
                        closeModal(overlay);
                        selectObject(currentObject);
                    }).catch(function(e) {
                        console.error(e);
                        showToast('Ошибка добавления записи');
                    });
                }
            };
        }

        function editRecord(day, month, year, currentHours, currentComment) {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            var modal = document.createElement('div');
            modal.className = 'modal-box';
            var title = document.createElement('h3');
            title.textContent = 'Редактирование записи ' + day + '.' + month + '.' + year;
            modal.appendChild(title);

            var inputTime = document.createElement('input');
            inputTime.type = 'number';
            inputTime.placeholder = 'Новое количество часов';
            inputTime.value = currentHours;
            inputTime.id = 'editTime';
            modal.appendChild(inputTime);

            var inputComment = document.createElement('textarea');
            inputComment.placeholder = 'Комментарий';
            inputComment.value = currentComment || '';
            inputComment.id = 'editComment';
            modal.appendChild(inputComment);

            var actions = document.createElement('div');
            actions.className = 'modal-actions';
            var saveBtn = document.createElement('button');
            saveBtn.className = 'btn-save';
            saveBtn.textContent = 'Сохранить';
            var cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-cancel';
            cancelBtn.textContent = 'Отмена';
            actions.appendChild(saveBtn);
            actions.appendChild(cancelBtn);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            cancelBtn.onclick = function() { closeModal(overlay); };

            saveBtn.onclick = function() {
                var newHours = inputTime.value.trim();
                if (!validateHours(newHours)) { showToast('Часы должны быть положительным числом'); return; }
                var hours = Number(newHours);
                var comment = inputComment.value.trim();
                var recordRef = db.ref('Objects/' + currentObject + '/' + year + '/' + month + '/' + day);
                recordRef.set({ hours: hours, comment: comment })
                    .then(function() {
                        showToast('Запись обновлена');
                        closeModal(overlay);
                        selectObject(currentObject);
                    })
                    .catch(function(e) {
                        console.error(e);
                        showToast('Ошибка обновления');
                    });
            };
        }

        function deleteRecord(day, month, year) {
            var recordRef = db.ref('Objects/' + currentObject + '/' + year + '/' + month + '/' + day);
            recordRef.remove()
                .then(function() {
                    showToast('Запись удалена');
                    selectObject(currentObject);
                })
                .catch(function(e) {
                    console.error(e);
                    showToast('Ошибка удаления записи');
                });
        }

        function deleteObject() {
            if (!currentObject) {
                var overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                var modal = document.createElement('div');
                modal.className = 'modal-box';
                var title = document.createElement('h3');
                title.textContent = 'Выберите объект для удаления';
                modal.appendChild(title);

                var listDiv = document.createElement('div');
                listDiv.className = 'export-list';

                var objectsRef = db.ref('Objects');
                objectsRef.once('value').then(function(snap) {
                    var data = snap.val();
                    if (!data) { showToast('Нет объектов для удаления'); closeModal(overlay); return; }
                    var selected = null;
                    for (var key in data) {
                        var label = document.createElement('label');
                        var span = document.createElement('span');
                        span.textContent = key;
                        var radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = 'deleteObject';
                        radio.value = key;
                        radio.onchange = function() { selected = this.value; };
                        label.appendChild(span);
                        label.appendChild(radio);
                        listDiv.appendChild(label);
                    }
                    modal.appendChild(listDiv);

                    var actions = document.createElement('div');
                    actions.className = 'modal-actions';
                    var delBtn = document.createElement('button');
                    delBtn.className = 'btn-save';
                    delBtn.textContent = 'Удалить выбранный';
                    var cancelBtn = document.createElement('button');
                    cancelBtn.className = 'btn-cancel';
                    cancelBtn.textContent = 'Отмена';
                    actions.appendChild(delBtn);
                    actions.appendChild(cancelBtn);
                    modal.appendChild(actions);
                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);

                    cancelBtn.onclick = function() { closeModal(overlay); };

                    delBtn.onclick = function() {
                        if (!selected) { showToast('Выберите объект'); return; }
                        if (!confirm('Удалить объект "' + selected + '" и все его записи?')) return;
                        var objRef = db.ref('Objects/' + selected);
                        objRef.remove()
                            .then(function() {
                                showToast('Объект удалён');
                                closeModal(overlay);
                                getObjects();
                            })
                            .catch(function(e) {
                                console.error(e);
                                showToast('Ошибка удаления объекта');
                            });
                    };
                }).catch(function(e) {
                    console.error(e);
                    showToast('Ошибка загрузки объектов');
                });
                return;
            }
            if (confirm('Удалить объект "' + currentObject + '" и все его записи?')) {
                var objRef = db.ref('Objects/' + currentObject);
                objRef.remove()
                    .then(function() {
                        showToast('Объект удалён');
                        currentObject = null;
                        getObjects();
                    })
                    .catch(function(e) {
                        console.error(e);
                        showToast('Ошибка удаления объекта');
                    });
            }
        }

        function exportExcel() {
            if (currentObject) {
                var objRef = db.ref('Objects/' + currentObject);
                objRef.once('value').then(function(snap) {
                    var data = snap.val();
                    if (!data) { showToast('Нет данных для экспорта'); return; }
                    var rows = [['Объект', 'Год', 'Месяц', 'День', 'Часы', 'Комментарий']];
                    for (var year in data) {
                        for (var month in data[year]) {
                            for (var day in data[year][month]) {
                                var entry = data[year][month][day];
                                var hours, comment = '';
                                if (typeof entry === 'number') { hours = entry; }
                                else if (entry && typeof entry === 'object') {
                                    hours = entry.hours || 0;
                                    comment = entry.comment || '';
                                } else { hours = 0; }
                                rows.push([currentObject, year, month, day, hours, comment]);
                            }
                        }
                    }
                    var wb = XLSX.utils.book_new();
                    var ws = XLSX.utils.aoa_to_sheet(rows);
                    XLSX.utils.book_append_sheet(wb, ws, 'Отчёт');
                    XLSX.writeFile(wb, currentObject + '_отчёт_' + new Date().toISOString().slice(0,10) + '.xlsx');
                    showToast('Отчёт по объекту выгружен');
                }).catch(function(e) { showToast('Ошибка экспорта'); });
                return;
            }

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            var modal = document.createElement('div');
            modal.className = 'modal-box';
            var title = document.createElement('h3');
            title.textContent = 'Выберите объекты для экспорта';
            modal.appendChild(title);

            var listDiv = document.createElement('div');
            listDiv.className = 'export-list';
            var objectsRef = db.ref('Objects');
            objectsRef.once('value').then(function(snap) {
                var data = snap.val();
                if (!data) { showToast('Нет объектов для экспорта'); return; }
                var checkboxes = {};
                for (var key in data) {
                    var label = document.createElement('label');
                    var span = document.createElement('span');
                    span.textContent = key;
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = key;
                    cb.checked = true;
                    checkboxes[key] = cb;
                    label.appendChild(span);
                    label.appendChild(cb);
                    listDiv.appendChild(label);
                }
                modal.appendChild(listDiv);

                var actions = document.createElement('div');
                actions.className = 'modal-actions';
                var selectAllBtn = document.createElement('button');
                selectAllBtn.className = 'btn-select-all';
                selectAllBtn.textContent = 'Выбрать все';
                var exportBtn = document.createElement('button');
                exportBtn.className = 'btn-save';
                exportBtn.textContent = 'Экспортировать выбранные';
                var cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn-cancel';
                cancelBtn.textContent = 'Отмена';
                actions.appendChild(selectAllBtn);
                actions.appendChild(exportBtn);
                actions.appendChild(cancelBtn);
                modal.appendChild(actions);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                selectAllBtn.onclick = function() {
                    var all = Object.values(checkboxes);
                    var checked = all.every(function(cb) { return cb.checked; });
                    all.forEach(function(cb) { cb.checked = !checked; });
                };

                cancelBtn.onclick = function() { closeModal(overlay); };

                exportBtn.onclick = function() {
                    var selected = Object.keys(checkboxes).filter(function(k) { return checkboxes[k].checked; });
                    if (selected.length === 0) { showToast('Выберите хотя бы один объект'); return; }
                    closeModal(overlay);
                    var allRows = [['Объект', 'Год', 'Месяц', 'День', 'Часы', 'Комментарий']];
                    var promises = selected.map(function(obj) {
                        return db.ref('Objects/' + obj).once('value').then(function(snap) {
                            var d = snap.val();
                            if (d) {
                                for (var year in d) {
                                    for (var month in d[year]) {
                                        for (var day in d[year][month]) {
                                            var entry = d[year][month][day];
                                            var hours, comment = '';
                                            if (typeof entry === 'number') { hours = entry; }
                                            else if (entry && typeof entry === 'object') {
                                                hours = entry.hours || 0;
                                                comment = entry.comment || '';
                                            } else { hours = 0; }
                                            allRows.push([obj, year, month, day, hours, comment]);
                                        }
                                    }
                                }
                            }
                        });
                    });
                    Promise.all(promises).then(function() {
                        if (allRows.length === 1) { showToast('Нет данных для выбранных объектов'); return; }
                        var wb = XLSX.utils.book_new();
                        var ws = XLSX.utils.aoa_to_sheet(allRows);
                        XLSX.utils.book_append_sheet(wb, ws, 'Отчёт');
                        XLSX.writeFile(wb, 'Отчёт_по_объектам_' + new Date().toISOString().slice(0,10) + '.xlsx');
                        showToast('Отчёт выгружен');
                    }).catch(function(e) { showToast('Ошибка экспорта'); });
                };
            }).catch(function(e) { showToast('Ошибка загрузки объектов'); });
        }

        document.getElementById('exportBtn').addEventListener('click', exportExcel);
        getObjects();
    </script>
</body>
</html>
